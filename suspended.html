<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suspended - Secure Site</title>
    <link rel="stylesheet" href="suspended.css">
  </head>
  <body>
    <main class="shell">
      <div class="lock" aria-hidden="true"><span></span></div>
      <p class="eyebrow" id="mode-label">Alia suspended tab</p>
      <h1 id="headline">Suspended</h1>
      <p id="description">This tab is resting to free browser memory.</p>
      <button id="restore" type="button">Restore tab</button>
    </main>
    <script src="suspended.js"></script>
  </body>
</html>
